name: Instagram AI Engagement Bot (Local Qwen)

on:
  schedule:
    - cron: '*/15 * * * *' # Automatically runs every 15 minutes
  workflow_dispatch: # Allows manual test triggers

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install requests

      # - name: Cache Ollama Models
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.ollama
      #     key: ${{ runner.os }}-ollama-${{ hashFiles('**/reply_bot.py') }}
      #     restore-keys: |
      #       ${{ runner.os }}-ollama-


      - name: Cache Ollama Models and Reply History
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama
            replied_comments.json
          key: ${{ runner.os }}-ollama-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ollama-history-

      - name: Install and Boot Ollama Service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          echo "⏳ Waiting for Ollama background daemon to stabilize..."
          sleep 5

      - name: Pull Qwen Model weights
        run: ollama pull qwen2.5:1.5b

      - name: Run AI Engagement Script
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python reply_bot.py
